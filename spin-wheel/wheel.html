<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Spin & Win</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- ================= Wheel screen ================= -->
  <div id="wheelScreen" class="screen">
    <div class="eyebrow">Member Rewards</div>
    <h1 class="title" style="font-size:26px; margin-bottom:2px;">Give it a spin</h1>
    <p class="subtitle" style="margin-bottom:0;">Your reward applies to the bill you just generated.</p>

    <div id="wheelWrap">
      <div id="shimmerRing"></div>
      <div id="wheelGlow"></div>
      <div id="wheelRing"></div>
      <canvas id="wheelCanvas" width="580" height="580"></canvas>
      <div id="hub">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 2l2.4 6.8L21 12l-6.6 2.9L12 22l-2.4-7.1L3 12l6.6-3.2L12 2z" fill="#241505"/></svg>
      </div>
      <svg id="pointer" viewBox="0 0 30 36" fill="none">
        <path d="M15 36C15 36 2 20.5 2 12C2 5.4 7.4 0 15 0C22.6 0 28 5.4 28 12C28 20.5 15 36 15 36Z" fill="#D4AF6A" stroke="#0A0A0E" stroke-width="1.5"/>
        <circle cx="15" cy="12" r="5" fill="#0A0A0E"/>
      </svg>
    </div>

    <button id="spinBtn">SPIN NOW</button>
    <p class="fineprint">One spin per bill · Discount applied automatically at checkout</p>
  </div>

  <!-- ================= Result modal ================= -->
  <div id="resultOverlay" class="overlay">
    <div id="resultCard">
      <div class="result-eyebrow" id="resultEyebrow">You won</div>
      <div class="result-value" id="resultValue">15%</div>
      <p class="result-desc" id="resultDesc">off your current bill.</p>
      <div class="coupon" id="resultCoupon">WHEEL-D15-0000</div>
      <button class="applyBtn" id="applyBtn">Apply to bill</button>
      <button class="closeBtn" id="closeBtn">Close</button>
    </div>
  </div>
</div>

<script>
(function(){

  /* =====================================================================
     SOUND ENGINE — lightweight synthesized SFX, no external audio files.
     Created lazily on first user interaction (browser autoplay rules).
     ===================================================================== */
  let audioCtx = null;
  function ensureAudio(){
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      audioCtx = new AC();
    }
    if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
    return audioCtx;
  }

  function playTone(freq, duration, opts = {}){
    const ctx = ensureAudio();
    if(!ctx) return;
    const { type = 'sine', gain = 0.16, delay = 0, slideTo = null } = opts;
    const t0 = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if(slideTo){ osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + duration); }
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(gain, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(g).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.02);
  }

  function playClickSound(){ playTone(520, 0.06, { type:'triangle', gain:0.14 }); }
  function playTickSound(){ playTone(1400, 0.035, { type:'square', gain:0.05 }); }
  function playLoseSound(){
    playTone(320, 0.18, { type:'sine', gain:0.14, slideTo:210 });
    playTone(220, 0.22, { type:'sine', gain:0.10, delay:0.05, slideTo:160 });
  }
  function playWinSound(isJackpot){
    const notes = isJackpot ? [523.25, 659.25, 783.99, 1046.5] : [523.25, 659.25, 783.99];
    notes.forEach((f, i) => playTone(f, 0.22, { type:'triangle', gain: isJackpot ? 0.17 : 0.15, delay: i*0.09 }));
  }

  /* =====================================================================
     REWARD ENGINE — EDIT THIS SECTION TO CHANGE DISCOUNTS / PROBABILITIES
     =====================================================================
     Each entry is one wedge on the wheel, drawn in this array's order.
     To change what can be won — add, remove, or reprice a wedge — only
     edit this array; the wheel drawing, spin animation, and result
     screen all read from it automatically.

     Fields:
       id       - unique string, sent to your billing system so it knows
                  which reward was won ('try_again' wedges are never
                  sent to billing)
       label    - text shown on the wedge (keep it short)
       type     - 'percent' | 'free_item' | 'none'
                  ('none' = Try Next Time, no reward)
       value    - discount amount (number for percent, string for a
                  free item, unused for 'none')
       weight   - relative odds of landing on this wedge. Bigger number
                  = more likely. Doesn't need to sum to 100, but doing
                  so makes it easy to read as a rough percentage.
       fillType - which wedge color treatment to use: 'gold' (standard
                  prize), 'jackpot' (bright, for the rare big win),
                  'burgundy' (specialty item), or 'slate' (muted, used
                  for Try Next Time so non-wins read as visually
                  different from real prizes)
     ===================================================================== */
  const REWARD_CONFIG = [
    { id:'try_1',       label:'TRY NEXT TIME', type:'none',      value:null,        weight:12, fillType:'slate' },
    { id:'d5',          label:'5% OFF',        type:'percent',   value:5,           weight:20, fillType:'gold' },
    { id:'try_2',       label:'TRY NEXT TIME', type:'none',      value:null,        weight:12, fillType:'slate' },
    { id:'d10',         label:'10% OFF',       type:'percent',   value:10,          weight:12, fillType:'gold' },
    { id:'try_3',       label:'TRY NEXT TIME', type:'none',      value:null,        weight:12, fillType:'slate' },
    { id:'d15',         label:'15% OFF',       type:'percent',   value:15,          weight:7,  fillType:'gold' },
    { id:'try_4',       label:'TRY NEXT TIME', type:'none',      value:null,        weight:12, fillType:'slate' },
    { id:'jackpot100',  label:'100% OFF',      type:'percent',   value:100,         weight:4,  fillType:'jackpot' }
  ];

  /* Toggle: if false, the button disables itself after one win — set
     this up per real bill/session in production (e.g. keyed to a
     bill ID) so a customer can't just keep spinning. */
  const ALLOW_MULTIPLE_SPINS = true;

  /* =====================================================================
     BILLING INTEGRATION PLACEHOLDER
     Replace the body of this function with a real call to your POS /
     billing backend so the discount gets applied to the customer's
     generated bill. Return a Promise if the call is async.
     ===================================================================== */
  function applyRewardToBill(reward, couponCode){
    console.log('[billing] TODO: apply reward to bill', { reward, couponCode });
    // Example real implementation:
    // return fetch('/api/bill/apply-discount', {
    //   method: 'POST',
    //   headers: { 'Content-Type': 'application/json' },
    //   body: JSON.stringify({ billId: currentBillId, rewardId: reward.id, value: reward.value, couponCode })
    // });
    return Promise.resolve({ ok:true });
  }

  /* Weighted random pick. Returns { reward, index }. */
  function pickWeightedReward(config){
    const total = config.reduce((sum, r) => sum + r.weight, 0);
    let roll = Math.random() * total;
    for(let i=0;i<config.length;i++){
      roll -= config[i].weight;
      if(roll <= 0) return { reward: config[i], index: i };
    }
    return { reward: config[config.length-1], index: config.length-1 };
  }

  function makeCouponCode(reward){
    const rand = Math.floor(1000 + Math.random()*9000);
    return `WHEEL-${reward.id.toUpperCase()}-${rand}`;
  }

  /* =====================================================================
     WHEEL RENDERING
     ===================================================================== */
  const canvas = document.getElementById('wheelCanvas');
  const cctx = canvas.getContext('2d');
  const SIZE = canvas.width;
  const CENTER = SIZE/2;
  const RADIUS = SIZE/2 - 8;

  const FILL_TEXT_COLOR = {
    gold: '#241505',
    jackpot: '#241505',
    burgundy: '#F3ECDD',
    slate: 'rgba(243,236,221,0.55)'
  };

  function buildGradients(){
    function radial(stops){
      const g = cctx.createRadialGradient(CENTER, CENTER, RADIUS*0.12, CENTER, CENTER, RADIUS);
      stops.forEach(([stop,color]) => g.addColorStop(stop,color));
      return g;
    }
    return {
      gold: radial([[0,'#F3D48B'],[0.6,'#D4AF6A'],[1,'#9C7A2E']]),
      jackpot: radial([[0,'#FFF0C4'],[0.5,'#F3D48B'],[1,'#B8903E']]),
      burgundy: radial([[0,'#9C4568'],[0.6,'#6B1E3C'],[1,'#3B0F26']]),
      slate: radial([[0,'#3E3D48'],[0.6,'#26252D'],[1,'#141319']])
    };
  }

  function drawWheel(){
    const gradients = buildGradients();
    const n = REWARD_CONFIG.length;
    const segAngle = (Math.PI*2)/n;
    cctx.clearRect(0,0,SIZE,SIZE);

    REWARD_CONFIG.forEach((r, i)=>{
      const start = -Math.PI/2 - segAngle/2 + i*segAngle;
      const end = start + segAngle;

      cctx.beginPath();
      cctx.moveTo(CENTER, CENTER);
      cctx.arc(CENTER, CENTER, RADIUS, start, end);
      cctx.closePath();
      cctx.fillStyle = gradients[r.fillType];
      cctx.fill();

      cctx.save();
      cctx.beginPath();
      cctx.moveTo(CENTER,CENTER);
      cctx.arc(CENTER,CENTER,RADIUS,start,end);
      cctx.closePath();
      cctx.strokeStyle = 'rgba(10,10,14,0.55)';
      cctx.lineWidth = 3;
      cctx.stroke();
      cctx.restore();

      const midAngle = start + segAngle/2;
      cctx.save();
      cctx.translate(CENTER, CENTER);
      cctx.rotate(midAngle);
      cctx.textAlign = 'right';
      cctx.textBaseline = 'middle';
      cctx.fillStyle = FILL_TEXT_COLOR[r.fillType];
      const fontSize = r.type === 'none' ? 20 : (r.type === 'free_item' ? 22 : 28);
      cctx.font = '600 ' + fontSize + "px 'Fraunces', serif";
      cctx.fillText(r.label, RADIUS - 26, 0);
      cctx.restore();
    });
  }
  drawWheel();

  /* =====================================================================
     SPIN LOGIC
     ===================================================================== */
  const spinBtn = document.getElementById('spinBtn');
  const pointerEl = document.getElementById('pointer');
  const wheelGlow = document.getElementById('wheelGlow');
  const overlay = document.getElementById('resultOverlay');
  const resultCard = document.getElementById('resultCard');
  const resultEyebrow = document.getElementById('resultEyebrow');
  const resultValue = document.getElementById('resultValue');
  const resultDesc = document.getElementById('resultDesc');
  const resultCoupon = document.getElementById('resultCoupon');
  const applyBtn = document.getElementById('applyBtn');
  const closeBtn = document.getElementById('closeBtn');

  let currentRotation = 0;
  let spinning = false;
  let hasSpun = false;
  let lastReward = null;
  let lastCoupon = null;

  const SEG_ANGLE_DEG = 360 / REWARD_CONFIG.length;
  const SPIN_DURATION_MS = 4600;

  /* Ticks the pointer every time the wheel crosses a wedge boundary,
     by watching the canvas's live rotation each frame. */
  let tickPrevBucket = null;
  let tickRafId = null;
  function trackTicks(){
    if(!spinning){ tickRafId = null; return; }
    const style = getComputedStyle(canvas);
    const matrix = new DOMMatrixReadOnly(style.transform);
    let angleDeg = Math.atan2(matrix.b, matrix.a) * (180/Math.PI);
    if(angleDeg < 0) angleDeg += 360;
    const bucket = Math.floor(angleDeg / SEG_ANGLE_DEG);
    if(tickPrevBucket !== null && bucket !== tickPrevBucket){
      pointerEl.classList.remove('tick');
      void pointerEl.offsetWidth;
      pointerEl.classList.add('tick');
      playTickSound();
    }
    tickPrevBucket = bucket;
    tickRafId = requestAnimationFrame(trackTicks);
  }

  function formatResult(reward){
    resultCard.classList.remove('lose');
    overlay.classList.remove('win');
    applyBtn.style.display = '';
    resultCoupon.style.display = '';

    if(reward.type === 'none'){
      resultCard.classList.add('lose');
      resultEyebrow.textContent = 'So close';
      resultValue.textContent = 'Try Next Time';
      resultDesc.textContent = 'No reward this round — better luck on your next visit.';
      applyBtn.style.display = 'none';
      resultCoupon.style.display = 'none';
      return;
    }

    overlay.classList.add('win');
    resultEyebrow.textContent = 'You won';
    if(reward.type === 'free_item'){
      resultValue.textContent = reward.value;
      resultValue.style.fontSize = '30px';
      resultDesc.textContent = 'On the house — show this at checkout.';
    } else if(reward.value >= 100){
      resultValue.textContent = reward.value + '%';
      resultValue.style.fontSize = '44px';
      resultDesc.textContent = 'Jackpot! Your bill is completely on us.';
    } else {
      resultValue.textContent = reward.value + '%';
      resultValue.style.fontSize = '44px';
      resultDesc.textContent = 'off your current bill.';
    }
  }

  function spawnSparkles(){
    resultCard.querySelectorAll('.sparkle').forEach(el => el.remove());
    const count = 14;
    for(let i=0;i<count;i++){
      const s = document.createElement('div');
      s.className = 'sparkle';
      const angle = (Math.PI*2*i)/count + Math.random()*0.3;
      const dist = 90 + Math.random()*60;
      s.style.setProperty('--dx', Math.cos(angle)*dist + 'px');
      s.style.setProperty('--dy', Math.sin(angle)*dist + 'px');
      s.style.animationDelay = (Math.random()*120)+'ms';
      resultCard.appendChild(s);
    }
  }

  function spin(){
    if(spinning) return;
    if(hasSpun && !ALLOW_MULTIPLE_SPINS) return;
    ensureAudio();
    spinning = true;
    spinBtn.disabled = true;
    wheelGlow.classList.add('active');

    const { reward, index } = pickWeightedReward(REWARD_CONFIG);
    lastReward = reward;

    const extraSpins = 6 + Math.floor(Math.random()*3); // 6-8 full turns
    const jitter = (Math.random()-0.5) * SEG_ANGLE_DEG * 0.7; // land off-center but inside the wedge

    // Compute delta relative to the wheel's ACTUAL current on-screen angle
    // (not just the raw accumulated total), so leftover jitter from a
    // previous spin never throws off where this spin lands.
    const currentMod = ((currentRotation % 360) + 360) % 360;
    const targetMod = (((-index*SEG_ANGLE_DEG + jitter) % 360) + 360) % 360;
    let deltaAngle = 360*extraSpins + (targetMod - currentMod);
    if(deltaAngle < 360*(extraSpins-1)) deltaAngle += 360; // keep enough full turns

    currentRotation += deltaAngle;

    tickPrevBucket = null;
    if(tickRafId === null){ tickRafId = requestAnimationFrame(trackTicks); }

    canvas.style.transition = `transform ${SPIN_DURATION_MS}ms cubic-bezier(0.14, 0.62, 0.1, 1)`;
    canvas.style.transform = `rotate(${currentRotation}deg)`;

    setTimeout(()=>{
      spinning = false;
      hasSpun = true;
      wheelGlow.classList.remove('active');
      lastCoupon = reward.type !== 'none' ? makeCouponCode(reward) : null;
      showResult(reward, lastCoupon);
      if(!ALLOW_MULTIPLE_SPINS){
        spinBtn.disabled = true;
        spinBtn.textContent = 'ALREADY SPUN';
      } else {
        spinBtn.disabled = false;
      }
    }, SPIN_DURATION_MS + 100);
  }

  function showResult(reward, couponCode){
    formatResult(reward);
    if(couponCode){ resultCoupon.textContent = couponCode; }
    applyBtn.classList.remove('applied');
    applyBtn.textContent = 'Apply to bill';
    applyBtn.disabled = false;
    overlay.classList.add('show');
    if(reward.type !== 'none'){
      spawnSparkles();
      playWinSound(reward.value >= 100);
    } else {
      playLoseSound();
    }
  }

  spinBtn.addEventListener('click', spin);

  applyBtn.addEventListener('click', ()=>{
    if(!lastReward || lastReward.type === 'none') return;
    applyBtn.disabled = true;
    applyRewardToBill(lastReward, lastCoupon).then(()=>{
      applyBtn.classList.add('applied');
      applyBtn.textContent = 'Applied ✓';
    });
  });

  closeBtn.addEventListener('click', ()=>{
    overlay.classList.remove('show');
  });

})();
</script>
</body>
</html>
